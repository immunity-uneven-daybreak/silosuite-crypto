name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build, test, lint (pinned toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy, rustfmt
      - run: cargo build --release
      - run: cargo test
      - run: cargo test --release
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check

  wasm:
    name: wasm build (pinned toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build --target web --out-dir pkg --release

  stable:
    # Deliberately no lint steps: this job exists to catch real breakage on newer
    # compilers, not to fail when a new Rust release adds pedantic lints.
    name: build + test (floating stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - run: cargo build --release
      - run: cargo test
